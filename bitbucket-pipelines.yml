# This is a pipeline to build and test FaCT++
# Only use spaces to indent your .yml configuration.
# -----
# Use custom image to build FaCT++
image: dtsarkov/factplusplus-dev:latest

pipelines:
  default:
    - step:
        script:
          # run CMake to build a make project
          - cmake --version
          - mkdir build
          - cd build
          - cmake -DCMAKE_BUILD_TYPE=Release -G "Unix Makefiles" .. 
          # build a project
          - cmake --build . --config Release -- -j3
          # make Java build and tests
          # NB: not offline (-o) any more - the OWL API 4.5.29 / Protege 5.6.x
          # dependencies are not pre-seeded in the build image's local repository.
          - mvn -f ../FaCT++.Java clean install
